<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация аккаунта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Создать аккаунт</h2>
        <!-- Важно: у элементов должны быть id, чтобы связать их с кодом -->
        <form id="register-form">
            <input type="email" id="email" placeholder="Электронная почта" required>
            <input type="password" id="password" placeholder="Придумайте пароль (мин. 6 знаков)" required>
            <button type="submit" class="btn-submit">Зарегистрироваться</button>
        </form>
        <p id="message" style="color: green; margin-top: 10px;"></p>
    </div>

    <!-- Подключаем JavaScript (создадим на шаге 3) -->
    <script src="auth.js" type="module"></script>
</body>
</html>

<hr>
<h2>Вход в аккаунт</h2>
<form action="/login" method="POST">
    <label for="login-email">Электронная почта:</label><br>
    <input type="email" id="login-email" name="email" required><br><br>

    <label for="login-password">Пароль:</label><br>
    <input type="password" id="login-password" name="password" required><br><br>

    <button type="submit">Войти</button>
</form>
